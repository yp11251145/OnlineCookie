<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cookie Store</title>
<style>
body{font-family:Arial;margin:0;background:#f5f5f5}
header{background:#8b5e3c;color:white;padding:15px;text-align:center}
.container{max-width:1200px;margin:auto;padding:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}
.card{background:white;padding:15px;border-radius:10px;box-shadow:0 2px 6px rgba(0,0,0,.15)}
button{background:#8b5e3c;color:white;border:none;padding:8px 12px;border-radius:6px;cursor:pointer}
input{width:100%;padding:8px;margin:5px 0}
#cartItems div{margin:8px 0}
/* Added styling to make sure images fit beautifully in the cards */
.product-img{width:100%;height:150px;object-fit:cover;border-radius:6px;margin-bottom:10px;}
</style>
</head>
<body>
<header><h1>🍪 Cookie Store</h1></header>
<div class="container">

<div class="card">
<h2>Signup</h2>
<input id="signupEmail" placeholder="Email">
<input id="signupPassword" type="password" placeholder="Password">
<button onclick="signup()">Signup</button>

<h2>Login</h2>
<input id="loginEmail" placeholder="Email">
<input id="loginPassword" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<button onclick="logout()">Logout</button>
<p id="userInfo">Not logged in</p>
</div>

<h2>Products</h2>
<div class="grid" id="products"></div>

<div class="card">
<h2>Cart</h2>
<div id="cartItems"></div>
<h3>Total: $<span id="total">0</span></h3>
</div>

<div class="card">
<h2>Checkout</h2>
<input id="customerName" placeholder="Name">
<input id="customerEmail" placeholder="Email">
<input id="customerAddress" placeholder="Address">
<input id="customerPhone" placeholder="Phone">
<button onclick="checkout()">Place Order</button>
</div>

<div class="card">
<h2>My Orders</h2>
<div id="orders"></div>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore,collection,addDoc,getDocs,query,where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAhZGiLbtJx_hNzndT6yljeu3KaA7CDBMc",
  authDomain: "onlinestore-45b2f.firebaseapp.com",
  projectId: "onlinestore-45b2f",
  storageBucket: "onlinestore-45b2f.firebasestorage.app",
  messagingSenderId: "964998619279",
  appId: "1:964998619279:web:1ab149bd4c786d76d0d0fa",
  measurementId: "G-X6MTRZX89X"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

emailjs.init("yZkeLriePU-BYo2WG");

// Added image URLs here
const products=[
{name:"Chocolate Chip Cookie",price:25,image:"https://images.unsplash.com/photo-1499636136210-6f4ee915583e?w=500&auto=format&fit=crop&q=60"},
{name:"Double Chocolate Cookie",price:30,image:"https://buttermilkbysam.com/wp-content/uploads/2022/09/bakery-style-double-chocolate-chip-cookies-2.jpg"},
{name:"Matcha Cookie",price:35,image:"https://kissatea.com/cdn/shop/articles/KISSA-Matcha_Vanilla_Cookies_7898403a-8156-4873-b3bc-fc2635163a7c.jpg?v=1747926570&width=1200"},
{name:"Red Velvet Cookie",price:35,image:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSbkfQ-ZN9E62La1NnoiwsNJLTJ-AkR7BDxBQ&s"}
];

let cart=[];

// Updated rendering to include the img tag
const productsDiv=document.getElementById("products");
products.forEach(p=>{
productsDiv.innerHTML+=`
<div class="card">
<img src="${p.image}" alt="${p.name}" class="product-img">
<h3>${p.name}</h3>
<p>$${p.price}</p>
<button onclick="addToCart('${p.name}',${p.price})">Add To Cart</button>
</div>`;
});

window.addToCart=(name,price)=>{
const item=cart.find(i=>i.name===name);
if(item)item.qty++;
else cart.push({name,price,qty:1});
renderCart();
}

function renderCart(){
const div=document.getElementById("cartItems");
div.innerHTML="";
let total=0;
cart.forEach(i=>{
total+=i.price*i.qty;
div.innerHTML+=`<div>${i.name} x ${i.qty} - $${i.price*i.qty}</div>`;
});
document.getElementById("total").textContent=total;
}

window.signup=async()=>{
await createUserWithEmailAndPassword(auth,
signupEmail.value,signupPassword.value);
alert("Account created");
}

window.login=async()=>{
await signInWithEmailAndPassword(auth,
loginEmail.value,loginPassword.value);
}

window.logout=async()=>{
await signOut(auth);
}

onAuthStateChanged(auth,async(user)=>{
userInfo.textContent=user?user.email:"Not logged in";
if(user) loadOrders();
});

async function loadOrders(){
const q=query(collection(db,"orders"),where("userId","==",auth.currentUser.uid));
const snap=await getDocs(q);
orders.innerHTML="";
snap.forEach(doc=>{
const o=doc.data();
orders.innerHTML+=`<div>${o.customerName} - $${o.total}</div>`;
});
}

window.checkout=async()=>{
if(!auth.currentUser){alert("Login first");return;}
if(cart.length===0){alert("Cart empty");return;}

const order={
userId:auth.currentUser.uid,
userEmail:auth.currentUser.email,
customerName:customerName.value,
customerEmail:customerEmail.value,
customerAddress:customerAddress.value,
customerPhone:customerPhone.value,
items:cart,
total:cart.reduce((a,b)=>a+b.price*b.qty,0),
orderDate:new Date().toISOString()
};

await addDoc(collection(db,"orders"),order);

await emailjs.send(
"service_vhr6tm8",
"template_0o7wsq6",
{
customer_name:order.customerName,
customer_email:order.customerEmail,
customer_address:order.customerAddress,
customer_phone:order.customerPhone,
items:order.items.map(i=>`${i.name} x${i.qty}`).join(", "),
total:order.total,
order_date:order.orderDate
}
);

alert("Order placed!");
cart=[];
renderCart();
loadOrders();
};
</script>
</body>
</html>
